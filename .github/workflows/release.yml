name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ITCH_TARGET: tomasvotava/the-eye-of-the-swarm
  BUTLER_VERSION: 15.31.0

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Check tag matches project version
        run: |
          expected="v$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $expected"
            exit 1
          fi

      - name: Build web archive
        run: make web-archive

      - name: Name archive after the tag
        run: |
          mkdir dist
          mv build/web.zip "dist/eye-of-the-swarm-${GITHUB_REF_NAME}-web.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: dist/
          if-no-files-found: error

  build-native:
    uses: ./.github/workflows/native-build.yml

  publish-github:
    needs: [build-web, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download web archive
        uses: actions/download-artifact@v8
        with:
          name: release-web
          path: dist/

      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: eye-of-the-swarm-*
          path: native/
          merge-multiple: true

      - name: Name native archives after the tag
        run: |
          for os in linux windows osx; do
            mv "native/eye-of-the-swarm-${os}.zip" "dist/eye-of-the-swarm-${GITHUB_REF_NAME}-${os}.zip"
          done

      # --verify-tag: the tag is pushed by a human; the workflow must never create one.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*

  publish-itch-web:
    needs: [build-web, publish-github]
    runs-on: ubuntu-latest
    environment: itch.io
    steps:
      - name: Download web archive
        uses: actions/download-artifact@v8
        with:
          name: release-web
          path: dist/

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push dist/*-web.zip "${ITCH_TARGET}:html5" --userversion "$GITHUB_REF_NAME"

  publish-itch-native:
    needs: [build-native, publish-github]
    runs-on: ubuntu-latest
    environment: itch.io
    steps:
      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: eye-of-the-swarm-*
          path: dist/
          merge-multiple: true

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      # butler reads a zip as the directory inside it, so delta patches still work per file.
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          for os in linux windows osx; do
            butler push "dist/eye-of-the-swarm-${os}.zip" "${ITCH_TARGET}:${os}" --userversion "$GITHUB_REF_NAME"
          done
