[project]
name = "eye"
version = "0.0.1"
description = "Eye of the Swarm"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Tomas Votava", email = "info@tomasvotava.eu" }]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "ruff>=0.16.5",
]

[tool.mypy]
strict = true
python_version = "3.14"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
  "N",
  "UP",
  "S",
  "A",
  "DTZ",
  "PT",
  "SIM",
  "PTH",
  "PD",
  "RUF",
  "T20"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF018"]
